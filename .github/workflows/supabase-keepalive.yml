# Keeps the free Supabase project from being paused for inactivity.
#
# Supabase pauses free projects that haven't seen "sufficient activity" for
# ~7 days. A single read every 3 days turned out not to be enough (the project
# was paused on 2026-11-16 despite successful pings), and once a day wasn't
# either (paused again on 2026-11-20). Supabase wants "a few user requests to
# the database each day", so this now runs every 4 hours and does both a read
# and a write.
#
# It also commits a heartbeat file when the repo has had no commit for 25+
# days, because GitHub disables scheduled workflows in repos with no activity
# for 60 days.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       e.g. https://rovsbafnldavsewobdoa.supabase.co
#   SUPABASE_ANON_KEY  the project's anon / publishable key
#
# Required in the database: the public.keepalive table and the
# public.keepalive_ping() function (see README.md).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 */4 * * *" # every 4 hours (6 times a day)
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: write # for the heartbeat commit

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read from the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"; cat response.json; echo
          [ "$status" = "200" ] || { echo "::error::Read ping failed"; exit 1; }

      - name: Write to the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $status"; cat response.json; echo
          [ "$status" = "200" ] || { echo "::error::Write ping failed"; exit 1; }

      - uses: actions/checkout@v4

      - name: Heartbeat commit (keeps the schedule from being disabled)
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit was $age_days days ago"
          if [ "$age_days" -ge 25 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > last-heartbeat.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add last-heartbeat.txt
            git commit -m "Heartbeat: keep scheduled workflow enabled"
            git push
          fi
